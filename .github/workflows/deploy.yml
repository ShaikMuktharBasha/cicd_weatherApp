name: Deploy Weather App

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Frontend/**'
      - 'Backend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'Frontend/**'
      - 'Backend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/weather-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/weather-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check Dockerfiles exist
      run: |
        if [ ! -f "Backend/Dockerfile" ]; then
          echo "Backend Dockerfile not found!"
          exit 1
        fi
        if [ ! -f "Frontend/Dockerfile" ]; then
          echo "Frontend Dockerfile not found!"
          exit 1
        fi
        echo "✅ All Dockerfiles found"

    - name: Validate docker-compose files
      run: |
        if [ -f "docker-compose.multi.yml" ]; then
          docker-compose -f docker-compose.multi.yml config --quiet
          echo "✅ docker-compose.multi.yml is valid"
        fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env[format('{0}_IMAGE', matrix.service)] }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service == 'backend' && 'Backend' || 'Frontend' }}
        file: ./${{ matrix.service == 'backend' && 'Backend/Dockerfile' || 'Frontend/Dockerfile' }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deployment completed successfully!"
        echo "Backend image: ${{ env.BACKEND_IMAGE }}:latest"
        echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:latest"
        echo "Images are ready for deployment to your hosting platform"