name: Development Build

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'Frontend/**'
      - 'Backend/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rebuild'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - frontend
        - backend
      environment:
        description: 'Build environment'
        required: false
        default: 'development'
        type: choice
        options:
        - development
        - testing

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/weather-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/weather-frontend

jobs:
  build-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]
        exclude:
          - service: ${{ github.event.inputs.service == 'frontend' && 'backend' || (github.event.inputs.service == 'backend' && 'frontend' || 'none') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env[format('{0}_IMAGE', matrix.service)] }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=dev-
          type=raw,value=dev-latest

    - name: Build and push development Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service == 'backend' && 'Backend' || 'Frontend' }}
        file: ./${{ matrix.service == 'backend' && 'Backend/Dockerfile.multi' || 'Frontend/Dockerfile' }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_ENV=development

    - name: Generate local rebuild script
      if: matrix.service == 'frontend'
      run: |
        cat > rebuild-frontend-local.sh << 'EOF'
        #!/bin/bash
        echo "🔄 Rebuilding Frontend Container Locally..."

        # Stop and remove existing container
        docker-compose -f docker-compose.multi.yml stop frontend
        docker-compose -f docker-compose.multi.yml rm -f frontend

        # Pull latest development image
        echo "📥 Pulling latest development image..."
        docker pull ${{ env.FRONTEND_IMAGE }}:dev-latest

        # Start with new image
        echo "🚀 Starting updated frontend container..."
        docker-compose -f docker-compose.multi.yml up -d frontend

        echo "✅ Frontend container rebuilt successfully!"
        echo "🌐 Frontend URL: http://localhost:3000"
        EOF

        chmod +x rebuild-frontend-local.sh
        echo "📋 Local rebuild script created: rebuild-frontend-local.sh"

  notify-dev:
    needs: build-dev
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Development build notification
      run: |
        echo "🎉 Development Build Completed!"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo ""
        echo "📦 Images built and pushed:"
        echo "- Backend: ${{ env.BACKEND_IMAGE }}:dev-latest"
        echo "- Frontend: ${{ env.FRONTEND_IMAGE }}:dev-latest"
        echo ""
        echo "🔄 To update your local containers, run:"
        echo "docker-compose -f docker-compose.multi.yml pull"
        echo "docker-compose -f docker-compose.multi.yml up -d"