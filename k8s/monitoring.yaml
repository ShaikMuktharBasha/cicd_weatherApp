apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: weather-app
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'weather-app-backend'
        static_configs:
          - targets: ['backend.weather-app.svc.cluster.local:8080']
        metrics_path: '/actuator/prometheus'

      - job_name: 'weather-app-frontend'
        static_configs:
          - targets: ['frontend.weather-app.svc.cluster.local:3000']
        metrics_path: '/metrics'

      - job_name: 'mysql'
        static_configs:
          - targets: ['mysql.weather-app.svc.cluster.local:3306']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: weather-app
  labels:
    app: grafana
data:
  weather-app-dashboard.json: |
    {
      "dashboard": {
        "title": "Weather App Dashboard",
        "tags": ["weather-app"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Backend Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "http_server_requests_seconds_sum{method=\"GET\"} / http_server_requests_seconds_count{method=\"GET\"}",
                "legendFormat": "Response Time"
              }
            ]
          },
          {
            "title": "Database Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "mysql_global_status_threads_connected",
                "legendFormat": "Active Connections"
              }
            ]
          }
        ]
      }
    }