apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-app-ingress-local
  namespace: weather-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: weather-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
---
# Alternative: LoadBalancer services for cloud providers
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
  namespace: weather-app
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000
    name: http
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: backend-lb
  namespace: weather-app
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: LoadBalancer